<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الاختبار الإلكتروني | رشيد العربية</title>
<style>*{box-sizing:border-box}:root{--g:#07583f;--bg:#f4f8f6;--b:#d7e5de;--t:#17392c;--m:#6d7d76;--gold:#c9a227}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--t)}.wrap{width:min(850px,92%);margin:30px auto 60px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.head img{width:65px;height:65px;object-fit:contain}.head h1{font-size:22px;margin:0;color:var(--g)}.back{color:var(--g);font-weight:700;text-decoration:none}.card{background:#fff;border:1px solid var(--b);border-radius:22px;padding:22px;box-shadow:0 8px 24px rgba(0,0,0,.04);margin-bottom:16px}.meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.pill{background:#edf7f2;color:var(--g);border:1px solid #d8ebe2;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:700}.q{background:#fff;border:1px solid var(--b);border-radius:18px;padding:18px;margin:14px 0}.q h3{margin:0 0 13px;font-size:16px}.option{display:block;border:1px solid #e0ebe6;border-radius:12px;padding:11px;margin:8px 0;cursor:pointer}.option:hover{background:#f8fbf9}.option input{margin-left:7px}.btn{border:0;background:var(--g);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.msg{padding:14px;border-radius:12px;margin-top:14px}.ok{background:#edf8f3;color:#07583f;border:1px solid #cfe8dc}.err{background:#fff0f0;color:#8c3030;border:1px solid #efc7c7}.score{font-size:30px;font-weight:900;color:var(--gold)}.muted{color:var(--m);line-height:1.8}</style></head><body>
<div class="wrap"><div class="head"><div class="brand"><img src="rasheed-arabic-logo.png" alt="رشيد العربية"><div><h1>رشيد العربية</h1><div class="muted">الاختبارات والواجبات الإلكترونية</div></div></div><a id="backLink" class="back" href="student/dashboard.html">← حسابي</a></div><div id="app"><div class="card">جاري تحميل النشاط...</div></div></div>
<script>
const SUPABASE_URL="https://wcyamoqmpwpribsgspjn.supabase.co",KEY="sb_publishable_3eJET0uhZw4D4DowMK13fQ_oWK3PdIQ",SESSION_KEY="rasheed_arabic_portal_session_v1";
const params=new URLSearchParams(location.search),token=params.get('token'),recipientId=params.get('id'),app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}function setSession(s){localStorage.setItem(SESSION_KEY,JSON.stringify(s))}
async function refreshSession(s){if(!s?.refresh_token)return null;const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});if(!r.ok)return null;const n=await r.json(),m={...s,user:n.user,access_token:n.access_token,refresh_token:n.refresh_token,expires_at:n.expires_at};setSession(m);return m}
async function rpcAnon(fn,body){return fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify(body)})}
async function rpcAuth(fn,body){let s=getSession();if(!s?.access_token||s.role!=='student')throw new Error('يلزم تسجيل الدخول بحساب الطالب.');const call=x=>fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${x.access_token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});let r=await call(s);if(r.status===401){s=await refreshSession(s);if(!s)throw new Error('انتهت الجلسة. سجّل الدخول مرة أخرى.');r=await call(s)}return r}
async function getActivity(){if(recipientId){document.getElementById('backLink').style.display='inline';return rpcAuth('get_my_assessment',{p_recipient_id:Number(recipientId)})}document.getElementById('backLink').style.display='none';if(token)return rpcAnon('get_assessment_by_token',{p_token:token});throw new Error('الرابط غير صحيح.')}
async function submitActivity(answers){if(recipientId)return rpcAuth('submit_my_assessment',{p_recipient_id:Number(recipientId),p_answers:answers});return rpcAnon('submit_assessment',{p_token:token,p_answers:answers})}
async function load(){try{const r=await getActivity();if(!r.ok){let t='';try{t=await r.text()}catch{};throw new Error(t.includes('NOT_YOUR_ASSESSMENT')?'هذا النشاط غير مخصص لهذا الحساب.':'تعذر فتح النشاط')}const a=await r.json();if(a.submitted_at){app.innerHTML=`<div class="card"><h2>${esc(a.title)}</h2><p>الطالب: <b>${esc(a.student_name)}</b></p><div class="msg ok">تم تسليم هذا النشاط بالفعل.<br><span class="score">${esc(a.score)} / ${esc(a.total_points)}</span></div></div>`;return}let html=`<div class="card"><h2>${esc(a.title)}</h2><p>الطالب: <b>${esc(a.student_name)}</b></p>${a.instructions?`<p class="muted">${esc(a.instructions)}</p>`:''}<div class="meta"><span class="pill">${a.kind==='quiz'?'اختبار إلكتروني':'واجب إلكتروني'}</span><span class="pill">الدرجة الكلية: ${esc(a.total_points)}</span>${a.due_at?`<span class="pill">التسليم: ${esc(new Date(a.due_at).toLocaleString('ar-SA'))}</span>`:''}</div></div><form id="assessmentForm">`;(a.questions||[]).forEach((q,i)=>{html+=`<div class="q"><h3>${i+1}. ${esc(q.question_text)} <small>(${esc(q.points)} درجة)</small></h3>`;if(q.question_type==='mcq'){(q.choices||[]).forEach((c,j)=>html+=`<label class="option"><input required type="radio" name="q_${q.id}" value="${j+1}"> ${esc(c)}</label>`)}else{html+=`<label class="option"><input required type="radio" name="q_${q.id}" value="صح"> صح</label><label class="option"><input required type="radio" name="q_${q.id}" value="خطأ"> خطأ</label>`}html+='</div>'});html+='<button class="btn" id="submitBtn" type="submit">تسليم الإجابات</button><div id="msg"></div></form>';app.innerHTML=html;document.getElementById('assessmentForm').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submitBtn'),msg=document.getElementById('msg');btn.disabled=true;btn.textContent='جاري التصحيح...';const fd=new FormData(e.target),answers={};(a.questions||[]).forEach(q=>answers[String(q.id)]=fd.get('q_'+q.id)||'');try{const rr=await submitActivity(answers);if(!rr.ok)throw new Error('تعذر تسليم الإجابات');const result=await rr.json();msg.innerHTML=`<div class="msg ok"><b>تم التسليم بنجاح ✓</b><br>درجتك: <span class="score">${esc(result.score)} / ${esc(result.total_points)}</span></div>`;btn.remove()}catch(err){btn.disabled=false;btn.textContent='تسليم الإجابات';msg.innerHTML=`<div class="msg err">${esc(err.message)}</div>`}}}catch(e){app.innerHTML=`<div class="card err">${esc(e.message)}</div>`}}load();
</script></body></html>
