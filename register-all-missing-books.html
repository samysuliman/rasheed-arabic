<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حصر جميع الكتب غير المستلمة | رشيد العربية</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f8f6;color:#17392c}header{background:linear-gradient(135deg,#07583f,#0b7554);color:#fff;padding:22px;text-align:center}header img{width:82px;height:82px;object-fit:contain;background:#fff;border-radius:18px;padding:6px}header h1{margin:10px 0 4px;font-size:26px}header p{margin:0;opacity:.9}main{width:min(1050px,94%);margin:28px auto}.panel{background:#fff;border:1px solid #d9e6df;border-radius:20px;padding:24px;box-shadow:0 8px 25px #0000000b;margin-bottom:20px}.intro{text-align:center}.intro h2{color:#07583f;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}label{display:block;font-weight:700;margin-bottom:7px}input,select{width:100%;padding:13px;border:1px solid #cddbd4;border-radius:11px;font-size:15px;background:#fff}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{padding:14px;border:1px solid #d5e2dc;background:#fff;border-radius:13px;cursor:pointer;font-weight:700}.choice.active{border-color:#08734f;background:#edf9f4;box-shadow:0 0 0 3px #08734f16}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.book-card{position:relative;min-height:125px;border:1px solid #d7e4de;background:#fff;border-radius:16px;padding:14px 8px;cursor:pointer;transition:.18s;color:#17392c}.book-card:hover{transform:translateY(-2px)}.book-card.selected{border:2px solid #08734f;background:#edf9f4;box-shadow:0 5px 15px #08734f18}.book-icon{display:block;font-size:34px;margin-bottom:7px}.book-card strong{display:block;font-size:14px}.book-card small{display:block;color:#75837c;margin-top:4px}.tick{display:none;position:absolute;top:7px;left:8px;background:#08734f;color:#fff;width:23px;height:23px;border-radius:50%;line-height:23px}.book-card.selected .tick{display:block}.actions{display:flex;gap:10px;justify-content:center;margin-top:20px}button.submit{border:0;background:#07583f;color:#fff;padding:14px 32px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}.msg{display:none;margin-top:15px;padding:13px;border-radius:10px;text-align:center}.msg.ok{display:block;background:#e9f8f1;color:#07583f}.msg.err{display:block;background:#fff0f0;color:#9a2929}.note{font-size:13px;color:#6c7a73;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.books{grid-template-columns:1fr 1fr}header h1{font-size:21px}}</style></head><body>
<header><img src="new-generation-logo.jpg" alt="شعار المدرسة"><h1>حصر جميع الكتب غير المستلمة</h1><p>Missing Books Census — All Subjects</p></header>
<main><section class="panel intro"><h2>تسجيل الكتب التي لم يستلمها الطالب</h2><p>اختر بيانات الطالب ثم اضغط على أي كتاب أو عدة كتب لم يتم استلامها.</p></section>
<form id="form" class="panel"><div class="grid"><div><label>اسم الطالب *</label><input id="student_name" required></div><div><label>اسم المعلم / المسجل *</label><input id="submitted_by" required></div>
<div><label>الجنس *</label><div class="choice-grid"><button type="button" class="choice gender" data-value="بنين">👦 بنين</button><button type="button" class="choice gender" data-value="بنات">👧 بنات</button></div></div>
<div><label>المرحلة *</label><select id="stage" required><option value="">اختر المرحلة</option><option>رياض أطفال</option><option>ابتدائي</option><option>متوسط</option><option>ثانوي</option></select></div>
<div><label>الصف *</label><select id="grade" required><option value="">اختر الصف</option><option>Grade 1</option><option>Grade 2</option><option>Grade 3</option><option>Grade 4</option><option>Grade 5</option><option>Grade 6</option><option>Grade 7</option><option>Grade 8</option><option>Grade 9</option><option>Grade 10</option><option>Grade 11</option><option>Grade 12</option></select></div><div><label>الشعبة *</label><input id="section_name" placeholder="مثال: A" required></div>
<div><label>المسار *</label><div class="choice-grid"><button type="button" class="choice curriculum" data-value="أمريكي">🇺🇸 أمريكي</button><button type="button" class="choice curriculum" data-value="بريطاني">🇬🇧 بريطاني</button></div></div></div>
<h3 style="margin-top:26px;color:#07583f">اختر الكتب غير المستلمة</h3><p class="note">يمكن اختيار كتاب واحد أو أكثر بالضغط على البطاقة.</p><div class="books"><button type="button" class="book-card" data-book="Islamic Studies" data-book-ar="الدراسات الإسلامية"><span class="book-icon">📗</span><strong>الدراسات الإسلامية</strong><small>Islamic Studies</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Arabic" data-book-ar="اللغة العربية"><span class="book-icon">📕</span><strong>اللغة العربية</strong><small>Arabic</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Social Studies" data-book-ar="الدراسات الاجتماعية"><span class="book-icon">🌍</span><strong>الدراسات الاجتماعية</strong><small>Social Studies</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="English / ELA" data-book-ar="اللغة الإنجليزية"><span class="book-icon">📘</span><strong>اللغة الإنجليزية</strong><small>English / ELA</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Mathematics" data-book-ar="الرياضيات"><span class="book-icon">➗</span><strong>الرياضيات</strong><small>Mathematics</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Science" data-book-ar="العلوم"><span class="book-icon">🔬</span><strong>العلوم</strong><small>Science</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Biology" data-book-ar="الأحياء"><span class="book-icon">🧬</span><strong>الأحياء</strong><small>Biology</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Chemistry" data-book-ar="الكيمياء"><span class="book-icon">⚗️</span><strong>الكيمياء</strong><small>Chemistry</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Physics" data-book-ar="الفيزياء"><span class="book-icon">⚛️</span><strong>الفيزياء</strong><small>Physics</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="History" data-book-ar="التاريخ"><span class="book-icon">🏛️</span><strong>التاريخ</strong><small>History</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Geography" data-book-ar="الجغرافيا"><span class="book-icon">🗺️</span><strong>الجغرافيا</strong><small>Geography</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Economics" data-book-ar="الاقتصاد"><span class="book-icon">📊</span><strong>الاقتصاد</strong><small>Economics</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Computer / ICT" data-book-ar="الحاسب / تقنية المعلومات"><span class="book-icon">💻</span><strong>الحاسب / تقنية المعلومات</strong><small>Computer / ICT</small><span class="tick">✓</span></button>
<button type="button" class="book-card" data-book="Art" data-book-ar="الفنون"><span class="book-icon">🎨</span><strong>الفنون</strong><small>Art</small><span class="tick">✓</span></button></div><div class="actions"><button class="submit" type="submit">حفظ الحصر</button></div><div id="msg" class="msg"></div></form></main>
<script>const URL='https://wcyamoqmpwpribsgspjn.supabase.co',KEY='sb_publishable_3eJET0uhZw4D4DowMK13fQ_oWK3PdIQ';let gender='',curriculum='';document.querySelectorAll('.gender').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gender').forEach(x=>x.classList.remove('active'));b.classList.add('active');gender=b.dataset.value});document.querySelectorAll('.curriculum').forEach(b=>b.onclick=()=>{document.querySelectorAll('.curriculum').forEach(x=>x.classList.remove('active'));b.classList.add('active');curriculum=b.dataset.value});document.querySelectorAll('.book-card').forEach(b=>b.onclick=()=>b.classList.toggle('selected'));document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');const selected=[...document.querySelectorAll('.book-card.selected')].map(b=>({name:b.dataset.book,ar:b.dataset.bookAr}));if(!gender||!curriculum||!selected.length){msg.className='msg err';msg.textContent='يرجى اختيار الجنس والمسار وكتاب واحد على الأقل.';return};const payload={student_name:student_name.value.trim(),gender,stage:stage.value,grade:grade.value,section_name:section_name.value.trim(),curriculum,missing_books:selected,submitted_by:submitted_by.value.trim()};try{const r=await fetch(URL+'/rest/v1/all_missing_books',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw new Error(await r.text());msg.className='msg ok';msg.textContent='تم تسجيل الكتب غير المستلمة بنجاح.';e.target.reset();gender='';curriculum='';document.querySelectorAll('.active,.selected').forEach(x=>x.classList.remove('active','selected'))}catch(err){msg.className='msg err';msg.textContent='تعذر الحفظ. تأكد من إنشاء جدول قاعدة البيانات أولًا.'}};</script></body></html>
