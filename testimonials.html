<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آراء أولياء الأمور | رشيد العربية</title><style>body{margin:0;background:#f6f8f5;color:#18352e;font-family:Tahoma,Arial,sans-serif}header{background:#073f34;color:#fff;text-align:center;padding:23px 12px}header h1{margin:0 0 15px}nav a{color:#f7d77c;margin:0 9px}main{max-width:850px;margin:26px auto;padding:0 16px}h2{margin:0 0 6px}.intro{color:#62756c;margin-bottom:22px}.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}.review{background:#fff;border:1px solid #e0e9e3;border-radius:17px;padding:22px;box-shadow:0 5px 19px #153b2710}.review h3{margin:0 0 16px;color:#073f34;font-size:19px}.question{font-weight:bold;margin:0 0 8px}.en{display:block;color:#69796f;font-size:12px;font-weight:normal;direction:ltr;text-align:right;margin-top:4px}.stars{color:#bc8a21;font-size:25px;letter-spacing:2px}.empty{color:#d6dcd7}.score{color:#53675c;font-size:14px}.recommend{margin-top:17px;padding-top:14px;border-top:1px solid #e9eee9}.answer{display:inline-block;background:#edf5ef;color:#125b3d;border-radius:20px;padding:7px 12px;margin-top:9px;font-weight:bold}.answer.maybe{background:#fff6e6;color:#855a10}.answer.no{background:#fff0f0;color:#8b3030}#status{color:#64746b}footer{text-align:center;padding:28px;color:#64746b}@media print{header,nav{display:none}body{background:white}.review{break-inside:avoid;box-shadow:none}}</style></head><body><header><h1>رشيد العربية | Rasheed Arabic</h1><nav><a href="index.html">الرئيسية</a><a href="feedback.html">إرسال تقييم</a><a href="testimonials.html">الآراء المنشورة</a></nav></header><main><h2>آراء أولياء الأمور</h2><p class="intro">تقييم شرح المعلم والتوصية بالدراسة معه | Parent Feedback</p><p id="status">جارٍ تحميل التقييمات...</p><div id="reviews" class="reviews"></div></main><footer>رشيد العربية © 2026</footer><script src="feedback-config.js"></script><script>const ratings={5:'ممتاز / Excellent',4:'جيد جدًا / Very Good',3:'جيد / Good',2:'مقبول / Fair',1:'يحتاج إلى تحسين / Needs Improvement'};function rec(v){const s=String(v??'').trim().toLowerCase();if(['yes','نعم','true','1'].includes(s))return ['نعم، أوصي بالدراسة معه / Yes',''];if(['no','لا','false','0'].includes(s))return ['لا / No','no'];if(['maybe','perhaps','ربما','possibly'].includes(s))return ['ربما / Maybe','maybe'];return [String(v??'غير محدد / Not specified'),'maybe']}async function load(){const status=document.getElementById('status');try{const data=await fbRequest('rpc/get_rasheed_public_feedback_v2',{method:'POST',body:'{}'});const parents=(Array.isArray(data)?data:[]).filter(x=>Number.isInteger(Number(x.explanation))&&Number(x.explanation)>=1&&Number(x.explanation)<=5);status.textContent=parents.length?'تقييمات وافق أصحابها على نشرها':'لا توجد تقييمات منشورة حاليًا.';document.getElementById('reviews').innerHTML=parents.map(x=>{const n=Number(x.explanation),r=rec(x.recommend);return `<article class="review"><h3>${fbEscape(x.full_name)}</h3><p class="question">كيف تقيّم أسلوب المعلم في الشرح؟<span class="en">How would you rate the teacher’s explanations?</span></p><div class="stars" aria-label="${n} من 5">${'★'.repeat(n)}<span class="empty">${'☆'.repeat(5-n)}</span></div><div class="score">${ratings[n]} (${n}/5)</div><div class="recommend"><p class="question">هل توصي بالدراسة مع الأستاذ سامي رشيد؟<span class="en">Would you recommend studying with the teacher?</span></p><span class="answer ${r[1]}">${fbEscape(r[0])}</span></div></article>`}).join('')}catch(e){status.textContent='تعذر تحميل التقييمات حاليًا. يرجى المحاولة لاحقًا.';console.error(e)}}load();</script></body></html>
