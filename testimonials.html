<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آراء أولياء الأمور | رشيد العربية</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f6f8f5;color:#18352e;margin:0}header{background:#073f34;color:white;padding:22px;text-align:center}header a{color:#f7d77c}main{max-width:790px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #e1e7e3;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 3px 15px #1232}h1,h2{margin:8px 0 18px}label{display:block;margin:13px 0 6px;font-weight:bold}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c7d6cc;border-radius:9px;font:inherit}textarea{min-height:105px}button,.btn{border:0;background:#0b5946;color:white;border-radius:9px;padding:12px 18px;font:inherit;cursor:pointer;margin:5px}button:disabled{opacity:.5;cursor:not-allowed}.gold{background:#bd8721;color:#fff}.small{font-size:12px;color:#5b6b63}.en{display:block;color:#69766e;font-size:12px;font-weight:normal;direction:ltr;text-align:right;margin-top:3px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}.consent{display:flex;align-items:flex-start;gap:10px}.consent input{width:auto;margin-top:5px}.error{color:#ad2631}.ok{color:#146a3e}.stars{color:#b47e13}.review{border-bottom:1px solid #eee;padding:15px 0}nav{margin-top:12px}nav a{margin:8px;color:#f4d890}footer{text-align:center;padding:20px;color:#64746b}@media print{header,nav,.no-print,button{display:none!important}body{background:white}.card{box-shadow:none}}</style></head><body><header><h1>رشيد العربية | Rasheed Arabic</h1><nav><a href="index.html">الرئيسية</a><a href="feedback.html">إرسال تقييم</a><a href="testimonials.html">الآراء المنشورة</a></nav></header><main><section class="card"><h2>آراء الطلاب وأولياء الأمور</h2><p>What Parents & Students Say</p><p id="status">جارٍ تحميل الآراء...</p><div id="reviews"></div></section></main><footer>رشيد العربية © 2026</footer><script src="feedback-config.js"></script><script>async function load(){const status=document.getElementById('status');try{const data=await fbRequest('rpc/get_rasheed_public_feedback',{method:'POST',body:'{}'});status.textContent=data.length?'آراء حقيقية وافق أصحابها على نشرها':'لا توجد آراء منشورة حتى الآن.';document.getElementById('reviews').innerHTML=data.map(x=>{const avg=([x.explanation,x.progress,x.engagement,x.communication].reduce((a,b)=>a+b,0)/4).toFixed(2);return `<article class="review"><strong>${fbEscape(x.full_name)}</strong> <span class="small">${x.role==='parent'?'ولي أمر / Parent':'طالب / Student'}</span><p class="stars">★ ${avg} / 5</p><p>${x.comment?fbEscape(x.comment):'تقييم رقمي فقط / Ratings only'}</p></article>`}).join('')}catch(e){status.className='error';status.textContent=e.message}}load()</script></body></html>
