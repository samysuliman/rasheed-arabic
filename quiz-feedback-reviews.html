<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آراء مستخدمي اختبارات رشيد العربية</title><style>body{font-family:Tahoma,Arial;background:#f4f8f6;color:#17392c;margin:0}header{background:#07583f;color:white;text-align:center;padding:25px}main{max-width:1000px;margin:25px auto;padding:15px}.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:15px}.card{background:white;border:1px solid #dbe7e1;border-radius:16px;padding:20px}.stars{color:#d7a01e;font-size:24px}</style></head><body><header><h1>آراء مستخدمي اختبارات رشيد العربية</h1><p>Rasheed Arabic Quiz Reviews</p></header><main><p id="state">جارٍ التحميل...</p><div id="reviews" class="reviews"></div></main><script src="feedback-config.js"></script><script>(async()=>{try{const a=await fbRequest('rpc/rasheed_quiz_survey_public',{method:'POST',body:'{}'});document.getElementById('state').textContent=a.length?'تقييمات وافق أصحابها على نشرها':'لا توجد تقييمات منشورة بعد';document.getElementById('reviews').innerHTML=a.map(r=>'<div class="card"><b>'+fbEscape(r.display_name)+'</b> · '+fbEscape(r.level)+'<p class="stars">'+'★'.repeat(r.rating)+'</p><p>'+fbEscape(r.comment)+'</p><p>التوصية: '+fbEscape(({yes:'نعم',maybe:'ربما',no:'لا'})[r.recommend]||'')+'</p></div>').join('')}catch(e){document.getElementById('state').textContent='تعذر تحميل التقييمات'}})()</script></body></html>
