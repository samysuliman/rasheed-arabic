<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة التقييمات | رشيد العربية</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f6f8f5;color:#18352e;margin:0}header{background:#073f34;color:white;padding:22px;text-align:center}header a{color:#f7d77c}main{max-width:790px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #e1e7e3;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 3px 15px #1232}h1,h2{margin:8px 0 18px}label{display:block;margin:13px 0 6px;font-weight:bold}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c7d6cc;border-radius:9px;font:inherit}textarea{min-height:105px}button,.btn{border:0;background:#0b5946;color:white;border-radius:9px;padding:12px 18px;font:inherit;cursor:pointer;margin:5px}button:disabled{opacity:.5;cursor:not-allowed}.gold{background:#bd8721;color:#fff}.small{font-size:12px;color:#5b6b63}.en{display:block;color:#69766e;font-size:12px;font-weight:normal;direction:ltr;text-align:right;margin-top:3px}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}.consent{display:flex;align-items:flex-start;gap:10px}.consent input{width:auto;margin-top:5px}.error{color:#ad2631}.ok{color:#146a3e}.stars{color:#b47e13}.review{border-bottom:1px solid #eee;padding:15px 0}nav{margin-top:12px}nav a{margin:8px;color:#f4d890}footer{text-align:center;padding:20px;color:#64746b}@media print{@page{size:A4;margin:14mm}header,nav,.no-print,button,footer{display:none!important}body{background:white;color:#111;font-size:12pt}main{max-width:none;margin:0;padding:0}.card{box-shadow:none;border:0;padding:0;margin:0}article.review{border:1px solid #bbb!important;padding:12px!important;margin:14px 0!important;break-inside:avoid;page-break-inside:avoid}article.review p{margin:8px 0}.answer-grid{display:block!important}.answer-item{padding:5px 0!important;border-bottom:1px solid #ddd!important}#list{margin-top:12px}#status{display:none}h2{font-size:18pt}}.answer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin:14px 0}.answer-item{padding:9px;background:#f6f8f5;border-radius:7px}.danger{background:#a72e32}.muted{color:#596a62}</style></head><body><header><h1>رشيد العربية | Rasheed Arabic</h1><nav><a href="index.html">الرئيسية</a><a href="feedback.html">إرسال تقييم</a><a href="testimonials.html">الآراء المنشورة</a></nav></header><main><section class="card"><h2>إدارة التقييمات / Feedback Administration</h2><p class="small">تتطلب صلاحية مدير موثقة في Supabase. لا تُعرض البيانات الخاصة للجمهور.</p><div class="card no-print"><h2>🔗 التحكم في رابط التقييمات</h2><p id="linkState">جارٍ التحقق...</p><button id="toggleLink" disabled>▶️ تشغيل</button><button id="copyLink">🔗 نسخ الرابط</button><a class="btn" href="feedback.html" target="_blank" rel="noopener">📝 النموذج</a><label>📅 آخر موعد (اختياري)</label><input id="closeDate" type="date"><button id="saveDate">حفظ الموعد</button></div><button class="no-print" id="load">تحميل التقييمات</button><button class="no-print" id="print" class="gold" disabled>تصدير PDF / طباعة</button><button class="no-print" id="csv" disabled>تصدير Excel (CSV)</button><label class="no-print">تصفية / Filter</label><select class="no-print" id="filter"><option value="all">الكل / All</option><option value="pending">قيد المراجعة / Pending</option><option value="approved">معتمد / Approved</option><option value="rejected">مرفوض / Rejected</option></select><p id="status"></p><div id="stats"></div><div id="list"></div></section></main><footer>رشيد العربية © 2026</footer><script src="feedback-config.js"></script><script src="assets/js/rasheed-core.js"></script><script>
let rows=[], linkOpen=false;const $=id=>document.getElementById(id);function current(){return rows.filter(x=>$('filter').value==='all'||x.status===$('filter').value)}function avg(x){return ((x.explanation+x.progress+x.engagement+x.communication)/4).toFixed(2)}
async function load(){try{$('status').textContent='جارٍ التحميل...';if(!window.Rasheed)throw Error('تعذر تحميل أدوات الدخول');const ok=await Rasheed.isAdmin();if(!ok)throw Error('يلزم تسجيل الدخول بحساب مدير مصرح له');rows=await Rasheed.get('rasheed_feedback?select=*&order=created_at.desc&limit=500');$('print').disabled=false;$('csv').disabled=false;$('status').textContent=`عدد التقييمات: ${rows.length}`;render()}catch(e){$('status').className='error';$('status').textContent=e.message||String(e)}}
const ratingText={5:'ممتاز / Excellent',4:'جيد جدًا / Very good',3:'جيد / Good',2:'مقبول / Fair',1:'يحتاج إلى تحسين / Needs improvement'};const roleText={parent:'ولي أمر / Parent',student:'طالب / Student'};const statusText={pending:'قيد المراجعة / Pending',approved:'معتمد / Approved',rejected:'مرفوض / Rejected'};const recommendText={yes:'نعم / Yes',maybe:'ربما / Maybe',no:'لا / No'};function answer(label,value){return `<div class="answer-item"><strong>${label}</strong><div>${fbEscape(ratingText[value]||'—')} (${fbEscape(value)}/5)</div></div>`}function render(){const data=current();$('stats').textContent=`المعروض: ${data.length} | معتمد: ${rows.filter(x=>x.status==='approved').length} | قيد المراجعة: ${rows.filter(x=>x.status==='pending').length}`;$('list').innerHTML=data.map(x=>`<article class="card review"><strong>${fbEscape(x.full_name)}</strong> — ${fbEscape(roleText[x.role]||x.role)} — ${avg(x)}/5 <span class="small">${fbEscape(x.created_at.slice(0,10))}</span><p>الحالة: ${fbEscape(statusText[x.status]||x.status)} | موافقة النشر: ${x.consent?'نعم':'لا'}</p><div class="answer-grid">${answer('كيف تقيّم أسلوب المعلم في الشرح؟ / Teacher explanations',x.explanation)}${answer('ما مدى تحسن مستوى الطالب؟ / Student progress',x.progress)}${answer('ما مدى تفاعل الطالب في الحصص؟ / Student engagement',x.engagement)}${answer('كيف تقيّم التواصل والمتابعة؟ / Communication and follow-up',x.communication)}<div class="answer-item"><strong>هل تنصح الآخرين بالدراسة مع الأستاذ سامي رشيد؟ / Would you recommend learning with Mr. Samy Rasheed?</strong><div>${fbEscape(recommendText[x.recommend]||'—')}</div></div></div><p><strong>التعليق / Comment:</strong> ${fbEscape(x.comment||'لا يوجد تعليق')}</p><p><strong>اقتراحات خاصة / Private suggestions:</strong> ${fbEscape(x.suggestions||'—')}</p><div class="no-print">${x.status!=='approved'?`<button data-id="${x.id}" data-action="approved" ${!x.consent||x.role==='student'?'disabled title="يجب التحقق من الموافقة والأهلية"':''}>اعتماد ونشر</button>`:''}<button data-id="${x.id}" data-action="rejected">رفض</button><button data-id="${x.id}" data-action="pending">إخفاء / مراجعة</button><button data-id="${x.id}" data-action="clear-comment" ${!x.comment?'disabled':''}>حذف التعليق فقط</button><button class="danger" data-id="${x.id}" data-action="delete">حذف التقييم نهائيًا</button></div></article>`).join('')}
$('list').addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;const x=rows.find(r=>r.id===b.dataset.id);if(!x)return;const action=b.dataset.action;if(action==='approved'&&(!x.consent||x.role==='student'))return alert('لا يمكن النشر دون تحقق من الموافقة المناسبة');if(action==='delete'){if(!confirm('تحذير: سيتم حذف هذا التقييم وجميع إجاباته وتعليقاته نهائيًا، ولا يمكن التراجع. هل أنت متأكد؟'))return;if(!confirm('تأكيد أخير: هل تريد حذف التقييم نهائيًا؟'))return}else if(action==='clear-comment'){if(!confirm('هل تريد حذف نص التعليق فقط مع الاحتفاظ بإجابات التقييم والدرجات؟'))return}else if(!confirm('تأكيد تغيير حالة التقييم؟'))return;b.disabled=true;try{if(action==='delete'){await Rasheed.api('/rest/v1/rasheed_feedback?id=eq.'+encodeURIComponent(x.id),{method:'DELETE'});rows=rows.filter(r=>r.id!==x.id)}else{const change=action==='clear-comment'?{comment:null}:{status:action};await Rasheed.api('/rest/v1/rasheed_feedback?id=eq.'+encodeURIComponent(x.id),{method:'PATCH',body:JSON.stringify(change)});Object.assign(x,change)}$('status').textContent=`عدد التقييمات: ${rows.length}`;render()}catch(err){alert(err.message||String(err))}finally{b.disabled=false}});
async function loadLink(){try{if(!await Rasheed.isAdmin())throw Error('يلزم تسجيل الدخول كمدير');const r=await Rasheed.rpc('census_public_status',{p_id:'feedback'});const x=r||{};linkOpen=!!x.open;$('closeDate').value=x.closes_on||'';$('linkState').textContent=linkOpen?'🟢 الرابط يعمل':'⏸️ الرابط متوقف';$('toggleLink').textContent=linkOpen?'⏸️ إيقاف':'▶️ تشغيل';$('toggleLink').disabled=false}catch(e){$('linkState').textContent=e.message||String(e)}}
async function setLink(open){try{await Rasheed.rpc('census_set',{p_id:'feedback',p_is_open:open,p_closes_on:$('closeDate').value||null});await loadLink()}catch(e){alert(e.message||String(e))}}
$('toggleLink').onclick=()=>setLink(!linkOpen);
$('saveDate').onclick=()=>setLink(linkOpen);
$('copyLink').onclick=async()=>{const url=new URL('feedback.html',location.href).href;try{await navigator.clipboard.writeText(url);alert('تم نسخ الرابط')}catch{prompt('انسخ الرابط',url)}};
loadLink();
$('filter').addEventListener('change',render);$('load').addEventListener('click',load);$('print').addEventListener('click',()=>window.print());$('csv').addEventListener('click',()=>{const header=['Name','Role','Explanation','Progress','Engagement','Communication','Recommend','Comment','Suggestions','Consent','Status','Date'];const lines=current().map(x=>[x.full_name,x.role,x.explanation,x.progress,x.engagement,x.communication,x.recommend,x.comment,x.suggestions,x.consent,x.status,x.created_at]);const csv='\ufeff'+[header,...lines].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download='rasheed-feedback.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)})
</script></body></html>
