<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة نتائج استبيان اختبارات رشيد العربية</title><style>
:root{--green:#07583f;--line:#dce8df}*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:#17392c;font-family:Tahoma,Arial,sans-serif}header{background:var(--green);color:white;text-align:center;padding:23px}header h1{font-size:25px;margin:0 0 8px}header p{margin:0;color:#d9eee4}main{max-width:980px;margin:24px auto;padding:0 15px}.panel,.review{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:15px;box-shadow:0 3px 13px #17392c0a}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:9px}button,.button{font:inherit;background:var(--green);color:white;border:0;border-radius:9px;padding:11px 15px;cursor:pointer;text-decoration:none}button.secondary,.button.secondary{background:#e9f2ec;color:#07583f}button:disabled{opacity:.5;cursor:not-allowed}.hint{color:#62746b;font-size:13px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}.head h2{font-size:19px;margin:0}.stars{color:#d7a11b;font-size:24px;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:14px 0}.item{background:#f5f8f6;border-radius:9px;padding:11px;overflow-wrap:anywhere}.item strong{display:block;font-size:13px;margin-bottom:6px}.item .en{display:block;direction:ltr;text-align:right;font-size:11px;font-weight:normal;color:#6c7c72}.answer{font-size:14px}.notes{border-top:1px solid var(--line);padding-top:12px}.notes p{white-space:pre-wrap;overflow-wrap:anywhere}.pick{display:flex;gap:7px;align-items:center}.pick input{width:18px;height:18px;accent-color:var(--green)}.tag{font-size:12px;color:#47675a;background:#e8f3eb;padding:5px 9px;border-radius:12px}.error{color:#ad2935}.success{color:#126e43}select{padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}body.selected-only .review:not(.selected){display:none!important}footer{text-align:center;color:#6d7d73;padding:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}.head h2{font-size:16px}}@media print{@page{size:A4;margin:13mm}body{background:white;color:#111;font-size:11pt}header,.no-print,footer{display:none!important}main{max-width:none;margin:0;padding:0}.panel{display:none!important}.review{box-shadow:none;border:1px solid #bbb;border-radius:6px;padding:12px;margin:0 0 12px;break-inside:avoid;page-break-inside:avoid}.review h2{font-size:15pt}.grid{grid-template-columns:1fr 1fr;gap:6px}.item{border:1px solid #ddd;background:white;padding:7px;break-inside:avoid}.item strong{font-size:10pt}.answer{font-size:10pt}.notes{font-size:10pt}.stars{font-size:18pt}.tag{border:1px solid #aaa;background:white}body.selected-only .review:not(.selected){display:none!important}}
</style></head><body><header><h1>نتائج استبيان اختبارات رشيد العربية</h1><p>Rasheed Arabic Quiz Feedback – Individual Reports</p></header><main><section class="panel no-print"><div class="toolbar"><a class="button secondary" href="admin-hub.html#surveys">العودة إلى الاستبيانات</a><button id="refresh">تحديث النتائج</button><button id="printAll">🖨️ طباعة الجميع / PDF</button><button id="printSelected" disabled>🖨️ طباعة المحدد</button><button id="csv" class="secondary">تصدير Excel (CSV)</button></div><p id="status" role="status">جارٍ تحميل النتائج...</p><div class="toolbar"><button class="secondary" id="selectAll">☑ تحديد الكل</button><button class="secondary" id="clear">إلغاء التحديد</button><label>تصفية حسب المستوى <select id="level"><option value="all">كل المستويات</option><option value="A">المستوى A</option><option value="B">المستوى B</option><option value="Advanced">المتقدم</option></select></label><span class="hint" id="count">المحدد: 0</span></div><p class="hint">تُعرض كل إجابة في بطاقة مستقلة. عند الطباعة تختفي أزرار الإدارة تلقائيًا.</p></section><div id="list"></div></main><footer>© رشيد العربية 2026</footer><script src="assets/js/rasheed-core.js"></script><script>
'use strict';let rows=[];const chosen=new Set();const $=id=>document.getElementById(id);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yn={yes:'نعم / Yes',no:'لا / No',somewhat:'إلى حد ما / Somewhat',maybe:'ربما / Maybe'};const role={parent:'ولي أمر / Parent',student:'طالب / Student'};const publish={no:'لا يسمح بالنشر',anonymous:'موافقة على النشر دون الاسم',first_name:'موافقة على النشر بالاسم الأول'};
const qs=[['instructions','هل كانت تعليمات الاختبار واضحة وسهلة الفهم؟','Were the quiz instructions clear?'],['suitability','هل كانت الأسئلة مناسبة لمستوى الطالب؟','Were questions appropriate for the level?'],['understanding','هل واجه الطالب صعوبة في فهم الأسئلة؟','Difficulty understanding questions?'],['answering','هل واجه الطالب صعوبة في اختيار الإجابات أو تسجيلها؟','Difficulty selecting or submitting answers?'],['pictures','هل ساعدت الصور والترجمة الإنجليزية على الفهم؟','Did pictures and translations help?'],['review','هل ساعد الاختبار الطالب على مراجعة ما تعلمه؟','Did the quiz help with review?']];
function visible(){return rows.filter(x=>$('level').value==='all'||x.level===$('level').value)}function field(ar,en,v){return '<div class="item"><strong>'+escapeHtml(ar)+'<span class="en">'+escapeHtml(en)+'</span></strong><div class="answer">'+escapeHtml(v||'—')+'</div></div>'}
function render(){const list=visible();$('list').innerHTML=list.map((r,i)=>{const id=escapeHtml(r.id);const stars='★'.repeat(Math.max(0,Math.min(5,Number(r.rating)||0)))+'☆'.repeat(5-Math.max(0,Math.min(5,Number(r.rating)||0)));return '<article class="review '+(chosen.has(r.id)?'selected':'')+'" data-id="'+id+'"><div class="head"><div><h2>'+(i+1)+'. '+escapeHtml(r.full_name)+'</h2><span class="hint">'+escapeHtml(role[r.role]||r.role)+' | المستوى '+escapeHtml(r.level)+' | '+escapeHtml(new Date(r.created_at).toLocaleDateString('ar-SA'))+'</span></div><div><div class="stars" aria-label="'+escapeHtml(r.rating)+'/5">'+stars+'</div><span class="tag">'+escapeHtml(r.rating)+'/5</span></div><label class="pick no-print"><input type="checkbox" data-id="'+id+'" '+(chosen.has(r.id)?'checked':'')+'> تحديد للطباعة</label></div><div class="grid">'+qs.map(([k,ar,en])=>field(ar,en,yn[r[k]]||r[k])).join('')+field('هل تنصح الآخرين باستخدام اختبارات رشيد العربية؟','Would you recommend these quizzes?',yn[r.recommend]||r.recommend)+field('إذن النشر','Publication permission',publish[r.publish]||r.publish)+'</div><div class="notes"><p><strong>الجزء الذي كان صعبًا / Difficult parts:</strong> '+escapeHtml(r.difficulty||'لا يوجد')+'</p><p><strong>مقترحات تطوير الاختبارات (خاصة بالإدارة) / Private suggestions:</strong> '+escapeHtml(r.suggestions||'لا يوجد')+'</p><p><strong>الرأي والتعليق / Comment:</strong> '+escapeHtml(r.comment||'لا يوجد')+'</p></div><div class="no-print" style="margin-top:14px;text-align:left"><button type="button" class="delete-review" data-delete-id="'+id+'" style="background:#a52b32">🗑 حذف هذا التقييم نهائيًا</button></div></article>'}).join('');$('status').textContent='إجمالي الردود: '+rows.length+' | المعروض: '+list.length;$('count').textContent='المحدد: '+chosen.size;$('printSelected').disabled=chosen.size===0}
async function load(){try{$('status').textContent='جارٍ تحميل النتائج...';if(!window.Rasheed||!Rasheed.session()?.access_token||!await Rasheed.isAdmin()){ $('status').className='error';$('status').textContent='يلزم تسجيل الدخول بحساب مدير مخوّل لعرض النتائج';return}const result=await Rasheed.rpc('rasheed_quiz_survey_admin_results');if(!Array.isArray(result))throw Error('استجابة غير متوقعة');rows=result;render()}catch(e){$('status').className='error';$('status').textContent='تعذر تحميل النتائج: '+(e.message||e)}}
$('list').addEventListener('click',async e=>{const b=e.target.closest('button.delete-review');if(!b)return;const id=b.dataset.deleteId;const r=rows.find(x=>x.id===id);if(!r)return;if(!confirm('هل تريد حذف تقييم '+r.full_name+' نهائيًا من قاعدة البيانات؟ لا يمكن التراجع عن الحذف.'))return;if(!confirm('تأكيد أخير: سيتم حذف التقييم وجميع إجاباته نهائيًا. هل أنت متأكد؟'))return;b.disabled=true;try{const deleted=await Rasheed.rpc('rasheed_quiz_survey_admin_delete',{p_id:id});if(deleted!==true)throw Error('لم يتم العثور على التقييم أو لم يتم حذفه');rows=rows.filter(x=>x.id!==id);chosen.delete(id);render();$('status').textContent+=' | تم حذف التقييم بنجاح';}catch(err){alert('تعذر حذف التقييم: '+(err.message||err));b.disabled=false}});
$('list').addEventListener('change',e=>{const cb=e.target.closest('input[data-id]');if(!cb)return;cb.checked?chosen.add(cb.dataset.id):chosen.delete(cb.dataset.id);render()});$('selectAll').onclick=()=>{visible().forEach(x=>chosen.add(x.id));render()};$('clear').onclick=()=>{chosen.clear();render()};$('level').onchange=render;$('refresh').onclick=load;function print(selected){if(selected&&!chosen.size){alert('حدد بطاقة واحدة على الأقل');return}document.body.classList.toggle('selected-only',selected);window.print()}$('printAll').onclick=()=>print(false);$('printSelected').onclick=()=>print(true);window.addEventListener('afterprint',()=>document.body.classList.remove('selected-only'));
$('csv').onclick=()=>{const columns=[['created_at','التاريخ'],['full_name','الاسم'],['role','الصفة'],['level','المستوى'],['rating','النجوم'],...qs.map(([k,ar])=>[k,ar]),['difficulty','الصعوبات'],['suggestions','المقترحات'],['comment','التعليق'],['recommend','التوصية'],['publish','إذن النشر']];const csvCell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[columns.map(x=>csvCell(x[1])).join(','),...visible().map(r=>columns.map(([k])=>csvCell(r[k])).join(','))].join('\r\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='rasheed-quiz-survey-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};load();
</script></body></html>
