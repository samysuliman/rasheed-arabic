<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتائج استبيان اختبارات رشيد</title><style>body{font-family:Tahoma,Arial;background:#f4f8f6;color:#17392c}main{margin:20px auto;max-width:1300px}table{border-collapse:collapse;width:100%;font-size:13px;background:white}td,th{border:1px solid #dbe7e1;padding:8px;text-align:right;vertical-align:top}th{background:#dfeee5}.scroll{overflow:auto}button,a{margin:8px;padding:8px}</style></head><body><main><h1>نتائج استبيان اختبارات رشيد العربية</h1><a href="admin-hub.html#surveys">العودة للاستبيانات</a><button id="export">تصدير CSV</button><button onclick="window.print()">طباعة</button><p id="status">جارٍ التحميل...</p><div class="scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div></main><script src="assets/js/rasheed-core.js"></script><script>const fields=[['created_at','التاريخ'],['full_name','الاسم'],['role','الصفة'],['level','المستوى'],['rating','النجوم'],['instructions','التعليمات'],['suitability','المناسبة'],['understanding','صعوبة الفهم'],['answering','صعوبة الإجابة'],['pictures','الصور والترجمة'],['review','الفائدة'],['difficulty','الصعوبات'],['suggestions','المقترحات'],['comment','التعليق'],['recommend','التوصية'],['publish','إذن النشر']];let rows=[];document.getElementById('head').innerHTML='<tr>'+fields.map(x=>'<th>'+x[1]+'</th>').join('')+'</tr>'; (async()=>{try{if(!Rasheed.session()?.access_token||!await Rasheed.isAdmin()){location.href='index.html#login';return}rows=await Rasheed.rpc('rasheed_quiz_survey_admin_results');document.getElementById('status').textContent='عدد الردود: '+rows.length;document.getElementById('rows').innerHTML=rows.map(r=>'<tr>'+fields.map(([k])=>'<td>'+Rasheed.esc(String(r[k]??''))+'</td>').join('')+'</tr>').join('')}catch(e){document.getElementById('status').textContent='تعذر تحميل الردود: '+(e.message||e)}})();document.getElementById('export').onclick=()=>{const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv='\ufeff'+[fields.map(x=>esc(x[1])).join(','),...rows.map(r=>fields.map(([k])=>esc(r[k])).join(','))].join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='quiz-feedback-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}</script></body></html>
